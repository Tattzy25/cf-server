<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Image Generator</title>

  <meta name="trigger-word" content="">

  <meta name="customer-id" content="">

  <meta name="generator-version" content="">

  <meta name="source-id" content="">

  <meta name="custom.cover_url" content="">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <style>

        * { font-family: 'DM Sans', sans-serif; }

        :root {

            --vh: 1vh;

            --mcp-endpoint: '';

        }

        body { background: #ffffff; color: #111827; }

        .aspect-pill { transition: all 0.2s ease; }

        .aspect-pill.active { background: #000; color: #fff; }

        .aspect-pill:not(.active) { background: transparent; border: 1px solid rgba(0,0,0,0.2); color: rgba(0,0,0,0.6); }

        .aspect-pill:not(.active):hover { border-color: rgba(0,0,0,0.5); color: #000; }

        .gen-btn { background: #000; color: #fff; transition: all 0.3s ease; }

        .gen-btn:hover:not(:disabled) { background: #222; transform: translateY(-1px); }

        .gen-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .upload-zone { border: 1px dashed rgba(0,0,0,0.2); transition: all 0.2s; }

        .upload-zone:hover, .upload-zone.dragover { border-color: rgba(0,0,0,0.6); background: rgba(0,0,0,0.03); }

        .img-card { position: relative; overflow: hidden; border-radius: 12px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; }

        .img-card img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s; }

        .img-card:hover img { transform: scale(1.02); }

        .img-actions { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); opacity: 0; transition: opacity 0.2s; display: flex; gap: 8px; justify-content: center; }

        .img-card:hover .img-actions { opacity: 1; }

        .action-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; border: none; color: #fff; }

        .action-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.1); }

        .action-btn.liked { color: #ff4757; }

        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; align-items: center; justify-content: center; }

        .lightbox.open { display: flex; }

        .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }

        .lightbox-close { position: absolute; top: 20px; right: 20px; }

        .num-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; background: #000000; border-radius: 2px; outline: none; }

        .num-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #000000; cursor: pointer; }

        .num-slider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #000000; cursor: pointer; border: none; }

        .sparkles-loader { display: flex; gap: 6px; align-items: center; justify-content: center; }

        .sparkle { font-size: 18px; display: inline-block; animation: sparkle-pulse 1.4s ease-in-out infinite; perspective: 1000px; }

        .sparkle:nth-child(1) { animation-delay: 0s; }

        .sparkle:nth-child(2) { animation-delay: 0.3s; }

        .sparkle:nth-child(3) { animation-delay: 0.6s; }

        #btn-text .sparkle { animation: sparkle-pulse 1.4s ease-in-out infinite; }

        #sparkle-left { animation-delay: 0s; }

        #sparkle-right { animation-delay: 0.3s; }

        @keyframes sparkle-pulse { 0%, 100% { opacity: 0.3; transform: scale(0.8) rotateZ(0deg); } 50% { opacity: 1; transform: scale(1.2) rotateZ(180deg); } }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .fade-up { animation: fadeUp 0.4s ease forwards; }

        .results-placeholder { border: 1px dashed rgba(0,0,0,0.1); border-radius: 16px; display: flex; align-items: center; justify-content: center; min-height: 300px; background: linear-gradient(135deg, #fafafa 0%, #ffffff 100%); }

        textarea { resize: none; }

        .upload-preview { max-height: 80px; border-radius: 8px; object-fit: cover; }

  </style>

  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>

  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>

  <script src="/_sdk/telemetry_sdk.js"></script>

</head>

<body data-template-id="__page-root" class="min-h-screen" style="background: rgb(255, 255, 255);">

  <script src="/_sdk/editing_sdk.js"></script>

  <div class="w-full min-h-screen flex flex-col lg:flex-row">

   <div class="w-full lg:w-[420px] lg:min-h-screen p-6 lg:p-8 flex flex-col gap-8 lg:border-r border-gray-200 shrink-0 bg-white text-black">

    <header>

     <h1 data-template-id="app-title" class="canva-text text-xl font-semibold tracking-tight" style="color: rgb(17, 24, 39); font-weight: 400; font-style: normal; font-size: 30px;">Trigger Word</h1>

     <p id="trigger-word-display" data-template-id="trigger-word-display" class="canva-text mt-1 text-center" style="color: rgb(0, 0, 0); font-size: 24px;"></p>

    </header>

    <div class="flex flex-col gap-2 mt-5">

     <label data-template-id="prompt-label" class="canva-text text-xs uppercase tracking-widest font-medium" for="prompt-input" style="color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-size: 26px;">Prompt</label> 

     <textarea id="prompt-input" rows="4" class="w-full bg-gray-50 border-2 border-black rounded-xl p-4 text-sm text-black placeholder-gray-400 focus:outline-none focus:border-black transition" placeholder="Describe what you want to generate..."></textarea>

    </div>

    <div class="flex flex-col gap-2 mt-5">

     <label data-template-id="ratio-label" class="canva-text text-xs uppercase tracking-widest font-medium" style="color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-size: 26px;">Aspect Ratio</label>

     <div class="flex gap-2" id="aspect-ratios">

      <button type="button" class="aspect-pill active px-4 py-2 rounded-full text-sm font-medium" data-ratio="1:1">1:1</button> 

      <button type="button" class="aspect-pill px-4 py-2 rounded-full text-sm font-medium" data-ratio="16:9">16:9</button> 

      <button type="button" class="aspect-pill px-4 py-2 rounded-full text-sm font-medium" data-ratio="9:16">9:16</button>

     </div>

    </div>

    <div class="flex flex-col gap-2 mt-[20px]">

     <div class="flex justify-between items-center">

      <label data-template-id="outputs-label" class="canva-text text-xs uppercase tracking-widest font-medium" style="color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-size: 26px;">Outputs</label> 

      <span id="num-display" class="text-sm font-medium">2</span>

     </div>

     <input type="range" min="1" max="4" value="2" class="num-slider" id="num-outputs">

    </div>

    <div class="flex flex-col gap-2 mt-[40px]">

     <label data-template-id="upload-label" class="canva-text text-xs uppercase tracking-widest font-medium" style="color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-size: 26px;">OPTIONAL</label>

     <div id="upload-zone" class="upload-zone rounded-xl p-6 flex flex-col items-center gap-2 cursor-pointer">

      <i data-lucide="image-plus" style="width:36px;height:36px;opacity:1;color:#000000;font-weight:900;stroke-width:1.5"></i> 

      <span class="text-base font-semibold opacity-80" style="color:#000000">Drop image or click to upload</span> 

      <input type="file" id="file-input" accept="image/*" class="hidden">

     </div>

     <div id="upload-preview-container" class="hidden flex items-center gap-3">

      <img id="upload-preview-img" class="upload-preview"> 

      <button type="button" id="remove-upload" class="text-xs opacity-50 hover:opacity-100 transition">✕ Remove</button>

     </div>

    </div>

    <button type="button" id="generate-btn" data-template-id="generate-btn" class="gen-btn w-full py-3 rounded-xl font-semibold text-sm lg:text-base tracking-wide mt-auto" style="font-size: 28px; color: rgb(255, 255, 255); font-family: Orbitron;"> 

     <span id="btn-text">Generate</span> 

     <span id="btn-loader" class="sparkles-loader hidden"><span class="sparkle">✦</span><span class="sparkle">✧</span><span class="sparkle">✨</span></span> 

    </button> 

    <div id="error-msg" class="hidden text-red-400 text-xs text-center mt-2"></div>

   </div>

   

   <div class="flex-1 p-6 lg:p-8 flex flex-col">

    <div id="results-empty" class="results-placeholder flex-1 bg-white rounded-lg shadow-sm border border-gray-100">

     <img src="https://tattty-uploads.tattty.com/TATTTYLOGO.png" alt="Tattty logo" class="w-full h-full object-contain p-12">

    </div>

    <div id="results-grid" class="hidden grid gap-4 flex-1 auto-rows-min" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));">

    </div>

   </div>

  </div>

  

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">

   <button type="button" class="lightbox-close action-btn" id="lightbox-close"><i data-lucide="x" style="width:20px;height:20px"></i></button> 

   <img id="lightbox-img" src="" alt="Full size preview">

  </div>



  <script>

    (function() {

        // ===== CONFIGURATION =====
        const CONFIG = {
            mcpEndpoint: 'https://mcp-artist-generator.avi-kay2019.workers.dev/', 
            customerId: '', 
            version: '',
            sourceId: 0,
        };



        // Try to read Shopify context securely

        let coverImageUrl = 'https://tattty-uploads.tattty.com/TATTTYLOGO.png'; 

        try {

            if (window.Shopify && window.Shopify.customer) {

                CONFIG.customerId = String(window.Shopify.customer.id || '');

            }

            const metaTriggerWord = document.querySelector('meta[name="trigger-word"]');

            if (metaTriggerWord) {

                const triggerWord = metaTriggerWord.getAttribute('content');

                if (triggerWord) document.getElementById('trigger-word-display').textContent = triggerWord;

            }

            const metaCustomer = document.querySelector('meta[name="customer-id"]');

            if (metaCustomer) CONFIG.customerId = metaCustomer.getAttribute('content') || CONFIG.customerId;

            const metaVersion = document.querySelector('meta[name="generator-version"]');

            if (metaVersion) CONFIG.version = metaVersion.getAttribute('content');

            const metaSource = document.querySelector('meta[name="source-id"]');

            if (metaSource) CONFIG.sourceId = parseInt(metaSource.getAttribute('content'), 10) || 0;

            const metaCoverUrl = document.querySelector('meta[name="custom.cover_url"]');

            if (metaCoverUrl) {

                const url = metaCoverUrl.getAttribute('content');

                if (url) coverImageUrl = url;

            }

        } catch(e) {}



        // State variables

        let selectedRatio = '1:1';

        let uploadedImageData = null;

        let generatedImages = [];

        let likedImages = new Set();



        // DOM Elements

        const promptInput = document.getElementById('prompt-input');

        const numOutputs = document.getElementById('num-outputs');

        const numDisplay = document.getElementById('num-display');

        const generateBtn = document.getElementById('generate-btn');

        const btnText = document.getElementById('btn-text');

        const btnSpinner = document.getElementById('btn-loader');

        const errorMsg = document.getElementById('error-msg');

        const resultsEmpty = document.getElementById('results-empty');

        const resultsGrid = document.getElementById('results-grid');

        const uploadZone = document.getElementById('upload-zone');

        const fileInput = document.getElementById('file-input');

        const uploadPreview = document.getElementById('upload-preview-container');

        const uploadPreviewImg = document.getElementById('upload-preview-img');

        const removeUpload = document.getElementById('remove-upload');

        const lightbox = document.getElementById('lightbox');

        const lightboxImg = document.getElementById('lightbox-img');

        const lightboxClose = document.getElementById('lightbox-close');



        // Aspect ratio change control

        document.getElementById('aspect-ratios').addEventListener('click', (e) => {

            const pill = e.target.closest('[data-ratio]');

            if (!pill) return;

            document.querySelectorAll('.aspect-pill').forEach(p => p.classList.remove('active'));

            pill.classList.add('active');

            selectedRatio = pill.dataset.ratio;

        });



        // Num outputs counter slider

        numOutputs.addEventListener('input', () => { numDisplay.textContent = numOutputs.value; });



        // Image upload handlers

        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });

        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));

        uploadZone.addEventListener('drop', (e) => {

            e.preventDefault();

            uploadZone.classList.remove('dragover');

            if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);

        });

        

        fileInput.addEventListener('change', () => { 

            if (fileInput.files[0]) handleFile(fileInput.files[0]); 

        });

        

        removeUpload.addEventListener('click', () => {

            uploadedImageData = null;

            uploadPreview.classList.add('hidden');

            uploadZone.classList.remove('hidden');

            fileInput.value = '';

        });



        // Restored complete missing function block execution context

        function handleFile(file) {

            const reader = new FileReader();

            reader.onload = (e) => {

                uploadedImageData = e.target.result;

                uploadPreviewImg.src = uploadedImageData;

                uploadPreview.classList.remove('hidden');

                uploadZone.classList.add('hidden');

            };

            reader.readAsDataURL(file);

        }



        // Processing & Execution execution block

        generateBtn.addEventListener('click', async () => {

            const prompt = promptInput.value.trim();

            if (!prompt) { showError('Please enter a prompt'); return; }

            if (!CONFIG.mcpEndpoint || CONFIG.mcpEndpoint === 'YOUR_MCP_ENDPOINT_URL_HERE') { 

                showError('Worker URL route configuration missing.'); 

                return; 

            }

            

            hideError();

            setLoading(true);



            // Exact JSON-RPC 2.0 formatting specification required by your pipeline

            const payload = {

                jsonrpc: "2.0",

                method: "tools/call",

                params: {

                    prompt: prompt,

                    aspectRatio: selectedRatio,

                    numOutputs: parseInt(numOutputs.value, 10),

                    uploadedImage: uploadedImageData || undefined,

                    customerId: CONFIG.customerId,

                    version: CONFIG.version,

                    sourceId: CONFIG.sourceId,

                    timestamp: new Date().toISOString()

                },

                id: 1

            };



            try {

                const res = await fetch(CONFIG.mcpEndpoint, {

                    method: 'POST',

                    headers: { 

                        'Content-Type': 'application/json', 

                        'Accept': 'application/json, text/event-stream' 

                    },

                    body: JSON.stringify(payload)

                });



                if (!res.ok) throw new Error(`HTTP Error status: ${res.status}`);



                const data = await res.json();

                

                // Handle multi-layered response parsing schemas securely

                let urls = [];

                if (data.body) {

                    const parsedBody = JSON.parse(data.body);

                    urls = parsedBody.urls || [];

                } else if (data.result && data.result.body) {

                    const parsedBody = JSON.parse(data.result.body);

                    urls = parsedBody.urls || [];

                } else if (data.result && data.result.urls) {

                    urls = data.result.urls;

                } else if (data.urls) {

                    urls = data.urls;

                }



                if (!urls.length) throw new Error('No images returned from payload process');

                

                generatedImages = urls;

                renderImages();

                

            } catch (err) {

                showError(err.message || 'Generation pipeline failed');

            } finally {

                setLoading(false);

            }

        });



        function setLoading(loading) {

            generateBtn.disabled = loading;

            if (!loading) {

                btnText.innerHTML = '<span class="sparkle" id="sparkle-left">✦</span><span>GENERATE</span><span class="sparkle" id="sparkle-right">✦</span>';

            } else {

                btnText.textContent = '';

            }

            btnSpinner.classList.toggle('hidden', !loading);

        }



        function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.remove('hidden'); }

        function hideError() { errorMsg.classList.add('hidden'); }



        function renderImages() {

            const imagesToRender = generatedImages.length > 0 ? generatedImages : [coverImageUrl];

            

            resultsEmpty.classList.add('hidden');

            resultsGrid.classList.remove('hidden');

            resultsGrid.innerHTML = '';



            imagesToRender.forEach((url, i) => {

                const card = document.createElement('div');

                card.className = 'img-card fade-up';

                card.style.animationDelay = `${i * 0.1}s`;

                card.style.opacity = '0';

                card.style.aspectRatio = selectedRatio === '1:1' ? '1/1' : selectedRatio === '16:9' ? '16/9' : '9/16';



                const isPlaceholder = generatedImages.length === 0;

                const actionButtons = isPlaceholder ? '' : `

                    <div class="img-actions">

                        <button type="button" class="action-btn" data-action="lightbox" data-idx="${i}" title="View"><i data-lucide="maximize-2" style="width:16px;height:16px"></i></button>

                        <button type="button" class="action-btn" data-action="download" data-idx="${i}" title="Download"><i data-lucide="download" style="width:16px;height:16px"></i></button>

                        <button type="button" class="action-btn" data-action="share" data-idx="${i}" title="Share"><i data-lucide="share-2" style="width:16px;height:16px"></i></button>

                        <button type="button" class="action-btn ${likedImages.has(i) ? 'liked' : ''}" data-action="like" data-idx="${i}" title="Like"><i data-lucide="heart" style="width:16px;height:16px"></i></button>

                    </div>

                `;



                card.innerHTML = `

                    <img src="${url}" alt="${isPlaceholder ? 'Cover image placeholder' : 'Generated image ' + (i + 1)}" loading="lazy" style="cursor:pointer">

                    ${actionButtons}

                `;

                resultsGrid.appendChild(card);

            });

            lucide.createIcons();

        }



        // Actions navigation delegation setup

        resultsGrid.addEventListener('click', (e) => {

            const btn = e.target.closest('[data-action]');

            const img = e.target.closest('.img-card img');

            if (img && !btn) {

                const idx = [...resultsGrid.children].indexOf(img.closest('.img-card'));

                openLightbox(idx);

                return;

            }

            if (!btn) return;

            const idx = parseInt(btn.dataset.idx);

            const action = btn.dataset.action;



            if (action === 'lightbox') openLightbox(idx);

            else if (action === 'download') downloadImage(idx);

            else if (action === 'share') shareImage(idx);

            else if (action === 'like') {

                if (likedImages.has(idx)) likedImages.delete(idx); else likedImages.add(idx);

                btn.classList.toggle('liked');

            }

        });



        function openLightbox(idx) {

            lightboxImg.src = generatedImages[idx];

            lightbox.classList.add('open');

        }

        lightboxClose.addEventListener('click', () => lightbox.classList.remove('open'));

        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });



        async function downloadImage(idx) {

            try {

                const res = await fetch(generatedImages[idx]);

                const blob = await res.blob();

                const a = document.createElement('a');

                a.href = URL.createObjectURL(blob);

                a.download = `tattty-gen-${idx + 1}.png`;

                a.click();

                URL.revokeObjectURL(a.href);

            } catch(e) {

                window.open(generatedImages[idx], '_blank');

            }

        }



        async function shareImage(idx) {

            if (navigator.share) {

                try { await navigator.share({ title: 'Generated Output', url: generatedImages[idx] }); } catch(e) {}

            } else {

                await navigator.clipboard.writeText(generatedImages[idx]);

                const btns = resultsGrid.querySelectorAll(`[data-action="share"][data-idx="${idx}"]`);

                btns.forEach(b => { b.style.background = 'rgba(255,255,255,0.5)'; setTimeout(() => b.style.background = '', 500); });

            }

        }



        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.classList.remove('open'); });



        lucide.createIcons();

    })();

  </script>

</body>

</html>
